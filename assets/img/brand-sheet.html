<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>АктионГаз — логотип</title>
<style>body{font-family:system-ui;margin:0;background:#F3F6F9;color:#121820} .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:24px}
.c{padding:24px;border-radius:8px;background:#fff;display:grid;gap:12px;place-items:center} .c.dark{background:#0E1A28;color:#fff} .c.blue{background:#0057A8;color:#fff} .c.red{background:#E31C23;color:#fff}
img{width:100%;max-width:360px} small{opacity:.7} .sm img{width:48px} .xs img{width:24px} h1{padding:24px 24px 0;margin:0;font-size:20px}</style></head><body>
<h1>Логотип «Актион газ» — новая отрисовка (на основе варианта 03-soft)</h1>
<div class="row">
<div class="c"><img src="logo.svg"><small>Основной, на светлом</small></div>
<div class="c dark"><img src="logo-on-dark.svg"><small>На тёмном фоне</small></div>
<div class="c"><img src="logo-mono.svg"><small>Монохром</small></div>
<div class="c blue"><img src="logo-mono-white.svg"><small>Инверсия на фирменном синем</small></div>
<div class="c"><img src="logo-mark.svg" style="max-width:160px"><small>Знак (аватар, фавиконка)</small></div>
<div class="c"><div class="sm"><img src="favicon.svg"></div><div class="xs"><img src="favicon.svg"></div><small>Favicon 48 / 24 px</small></div>
</div></body></html>
